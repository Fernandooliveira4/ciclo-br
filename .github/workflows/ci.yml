name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    name: Lint, testes e qualidade dos dados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Testes
        run: pytest -q

      # Roda contra os dados versionados no repositório. Se uma série chegou
      # vazia, com buraco na grade ou parada, o build cai aqui — que é o ponto:
      # um pipeline que quebra alto vale mais que um que grava lixo em silêncio.
      - name: Portões de qualidade dos dados
        run: ciclo-qualidade

      # Pega o caso de alguém versionar dado bruto sem recalcular os eixos:
      # o dashboard estaria mostrando número derivado de uma versão antiga.
      - name: Camada derivada em dia com o dado bruto
        run: ciclo-transformar --verificar

      - name: Regime em dia com a camada derivada
        run: ciclo-regime --verificar

      # O resultado que o projeto existe para mostrar: quantos meses o sinal se
      # antecipa ou atrasa em relação à datação oficial de recessões.
      - name: Defasagem contra o CODACE em dia
        run: ciclo-validar --verificar

      # Pega o caso de alguem versionar dado bruto sem remedir a surpresa: o
      # briefing citaria consenso de uma divulgacao que ja passou.
      - name: Surpresas em dia com o realizado e com o Focus
        run: ciclo-surpresa --verificar

      # O texto do briefing não é reproduzível — o modelo escreve diferente a
      # cada vez — mas a promessa sobre ele é. Este portão reconfere todos os
      # briefings publicados: todo número do texto tem que estar no JSON de
      # fatos daquele briefing, e o .md tem que conter o texto aprovado.
      - name: Briefings auditados contra os proprios fatos
        run: ciclo-briefing --auditar
