name: Ingestão diária

# O agendamento é o coração do projeto: o pipeline acorda todo dia, compara o
# que as APIs devolvem com o que já está gravado, e só produz commit quando há
# observação nova ou revisão. Na maior parte dos dias a mensagem é
# "ingest: sem dado novo" — e isso é o comportamento correto, não uma falha.
#
# O repositório é o banco de dados, então o commit de volta não é um detalhe de
# operação: é a gravação em si, e o histórico do Git vira o histórico de coletas.

on:
  schedule:
    # 09:30 e 14:00 em Brasília (UTC-3). O IBGE divulga às 9h, e a segunda
    # passada pega republicação e revisão do mesmo dia.
    - cron: "30 12 * * 1-5"
    - cron: "0 17 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Rebaixar desde o início de cada série"
        type: boolean
        default: false

# Duas execuções simultâneas escreveriam no mesmo Parquet e brigariam pelo push.
concurrency:
  group: ingestao
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        # Versões fixas, e não faixas do `pyproject`. Este job roda com
        # `contents: write` e dá push de volta: instalar por faixa faria uma
        # versão nova de qualquer dependência executar dentro de um job que
        # segura um token com permissão de escrita, sem decisão de ninguém.
        #
        # O SDK da Anthropic não entra: sem a chave, `llm.disponivel()` devolve
        # False antes de importá-lo e o briefing sai pelo gerador determinístico,
        # com o rodapé dizendo que saiu. Ver requirements-ci.txt.
        run: |
          pip install -r requirements-ci.txt
          pip install -e . --no-deps

      - name: Coletar séries
        run: |
          ciclo-ingest ${{ inputs.backfill && '--backfill' || '' }} \
            --resumo-arquivo "$RUNNER_TEMP/resumo.txt"

      # Auxiliar: se o calendário falhar, o próprio comando devolve 0 e o
      # pipeline segue. Ele não dispara nada — quem manda é o diff da série.
      - name: Atualizar calendário de divulgações
        run: ciclo-calendario

      # O cálculo é determinístico, então só grava quando o dado bruto mudou.
      - name: Recalcular camada derivada
        run: ciclo-transformar

      - name: Reclassificar regime
        run: ciclo-regime

      # A cronologia do CODACE é fixa; o que muda é o sinal. Refazer a medição
      # a cada coleta mantém a tabela de defasagem coerente com o classificador.
      - name: Remedir defasagem contra o CODACE
        run: ciclo-validar

      - name: Remedir surpresa das divulgacoes
        run: ciclo-surpresa

      # Compara os fatos de hoje com os do último briefing publicado. Se nada
      # mudou, não escreve nada — que é o caso na maioria dos dias. A chave é
      # opcional: sem ela o texto sai do gerador determinístico.
      - name: Escrever o briefing, se houver o que dizer
        run: ciclo-briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Portões de qualidade
        run: ciclo-qualidade

      - name: Publicar o que mudou
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada mudou — nenhum commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -F "$RUNNER_TEMP/resumo.txt"
          git push

      - name: Resumo da execução
        if: always()
        run: cat "$RUNNER_TEMP/resumo.txt" >> "$GITHUB_STEP_SUMMARY" || true
