# ---------------------------------------------------------------------------
# Fichas das séries do projeto.
#
# REGRA DURA: nenhuma série entra no projeto sem ficha completa aqui.
# Se não se sabe escrever a unidade, a transformação e o porquê dela existir,
# ela não entra. Esta regra é a proteção contra o inchaço de escopo.
#
# ajuste_sazonal:
#   origem        -> a fonte já publica dessazonalizado
#   proprio       -> dessazonalizamos nós, em janela expansiva (ver metodologia)
#   nao_aplicavel -> série que não pede ajuste (juros, câmbio, expectativas)
#
# papel:
#   eixo_crescimento / eixo_inflacao -> alimentam o classificador de regime
#   contexto                         -> exibição e conferência
#   auditoria                        -> existe para checar quebra metodológica
#   surpresa                         -> pareada com o realizado para medir surpresa
# ---------------------------------------------------------------------------
versao: 1

fontes:
  sgs:
    nome: Sistema Gerenciador de Séries Temporais do Banco Central
    base_url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.{codigo}/dados
    busca: https://www3.bcb.gov.br/sgspub/localizarseries/localizarSeries.do?method=prepararTelaLocalizarSeries
    limite: >
      Desde 26/03/2025 cada consulta cobre no máximo 10 anos; o cliente fatia em
      janelas de 9 anos.
  ibge:
    nome: API de agregados do IBGE (tabelas do SIDRA)
    base_url: https://servicodados.ibge.gov.br/api/v3/agregados/{tabela}/periodos/all/variaveis/{variavel}
    doc: https://servicodados.ibge.gov.br/api/docs/agregados
    nota: >
      Entrou no projeto porque o SGS deixou de servir: a familia 22xxx das Contas
      Nacionais so publica indice de volume, e as series a precos correntes foram
      descontinuadas em 2022. Sem precos correntes nao existe "% do PIB", que e a
      unidade da taxa de investimento. Ao contrario do SGS, esta API publica o
      nome da variavel e da categoria, entao a identificacao nao depende de
      conferencia as cegas - mas a ficha registra a conferencia mesmo assim.
  focus:
    nome: API de Expectativas de Mercado do Banco Central (Olinda/OData)
    base_url: https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/
    doc: https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/documentacao
    nota: >
      O campo Data e a data da coleta (diaria) e DataReferencia e o periodo projetado.
      E isso que permite reconstruir o consenso vigente na vespera de uma divulgacao.

series:

  # ---------------------------------------------------------------- ATIVIDADE
  - id: ibcbr_sa
    fonte: sgs
    codigo: 24364
    nome: IBC-Br - com ajuste sazonal
    bloco: atividade
    unidade: indice
    periodicidade: mensal
    ajuste_sazonal: origem
    inicio: 2003-01
    frescor_max_dias: 135   # sai ~45 dias apos o mes de referencia
    papel: eixo_crescimento
    transformacao: variacao % 3m/3m anualizada
    notas: >
      Eixo de crescimento do classificador. Dessazonalizado na fonte (BCB-Depec), o que
      dispensa ajuste proprio, mas tambem significa que o ajuste da fonte usa amostra
      completa. Ver limitacao declarada na pagina de Metodologia.

  - id: ibcbr
    fonte: sgs
    codigo: 24363
    nome: IBC-Br
    bloco: atividade
    unidade: indice
    periodicidade: mensal
    ajuste_sazonal: nao_aplicavel
    inicio: 2003-01
    frescor_max_dias: 135
    papel: contexto
    transformacao: variacao % interanual
    notas: >
      Serie sem ajuste, mantida para conferencia visual contra a versao dessazonalizada.

  - id: desocupacao
    fonte: sgs
    codigo: 24369
    nome: Taxa de desocupacao - PNAD Continua (trimestre movel)
    bloco: atividade
    unidade: "% da forca de trabalho"
    periodicidade: mensal
    ajuste_sazonal: proprio
    inicio: 2012-03
    papel: contexto
    transformacao: nivel dessazonalizado em janela expansiva
    notas: >
      Nao ha serie nacional dessazonalizada no SGS (confirmado): o ajuste e nosso.
      Variavel ciclica que tem expectativa mensal no Focus, e por isso sustenta o pilar
      de surpresa do lado da atividade, ja que nao existe consenso Focus para o IBC-Br.

  - id: pim_sa
    fonte: sgs
    codigo: 28503
    nome: Producao industrial - geral - dados dessazonalizados
    bloco: atividade
    unidade: indice (2022=100)
    periodicidade: mensal
    ajuste_sazonal: origem
    inicio: 2002-01
    frescor_max_dias: 135
    papel: contexto
    transformacao: variacao % 3m/3m anualizada
    notas: >
      Checagem independente do eixo de crescimento; comeca um ano antes do IBC-Br.

  - id: pim
    fonte: sgs
    codigo: 21859
    nome: Producao industrial - geral
    bloco: atividade
    unidade: indice (2022=100)
    periodicidade: mensal
    ajuste_sazonal: nao_aplicavel
    inicio: 2002-01
    frescor_max_dias: 135
    papel: contexto
    transformacao: variacao % interanual

  # ---------------------------------------------------------------- INFLACAO
  - id: pib
    fonte: sgs
    codigo: 22099
    nome: PIB trimestral - indice encadeado (media 1995 = 100)
    bloco: atividade
    unidade: indice (media 1995 = 100)
    periodicidade: trimestral
    ajuste_sazonal: nao_aplicavel
    inicio: 1996-01
    frescor_max_dias: 260   # o trimestre Q sai ~65 dias depois de fechar
    papel: surpresa
    transformacao: variacao % sobre o mesmo trimestre do ano anterior
    verificacao: >
      O BCB nao publica o nome das series do SGS por API, entao a definicao desta
      foi estabelecida por conferencia, nao por leitura de rotulo. Testados os
      codigos 22099, 22109 e 22110, todos indices trimestrais de PIB. A variacao
      interanual calculada a partir de 22099 reproduz o numero cheio do IBGE nos
      dois trimestres mais distintivos da amostra (2T2020: -10,1%; 2T2021:
      +12,4%) e e a que mais se aproxima da mediana do Focus ao longo de 94
      trimestres (desvio padrao 0,62 p.p. contra 0,70 e 1,62 das outras duas).
      Conferido em 12/09/2026.
    notas: >
      Realizado do lado da atividade, pareado com a expectativa de PIB do Focus,
      que e interanual - foi assim que a definicao ficou amarrada. Ajuste sazonal
      marcado como nao aplicavel porque a transformacao usada e interanual, que
      compara trimestres homologos e dispensa dessazonalizacao. Os tres primeiros
      pontos da serie (1995) sao 100,00 exatos, artefato da base do encadeamento,
      e por isso a ficha comeca em 1996.

  - id: ipca_nucleo_ma_suav
    fonte: sgs
    codigo: 4466
    nome: IPCA - nucleo por medias aparadas com suavizacao
    bloco: inflacao
    unidade: "% ao mes"
    periodicidade: mensal
    ajuste_sazonal: proprio
    inicio: null   # a confirmar no primeiro backfill
    papel: eixo_inflacao
    transformacao: media movel de 3 meses dessazonalizada e anualizada
    notas: >
      Eixo de inflacao do classificador. Nucleo, e nao IPCA cheio, para que choque de
      alimento e combustivel nao seja lido como mudanca de regime.
      Houve mudanca metodologica nos nucleos em dez/2025, auditada em 12/09/2026 contra a
      versao congelada (29675): 358 meses sobrepostos, 3 divergencias de no maximo 0.01 p.p.
      O BCB recalculou o historico, entao a serie e usada inteira, sem emenda.
      Ver docs/metodologia.md.

  - id: ipca_nucleo_ma_suav_v2025
    fonte: sgs
    codigo: 29675
    nome: IPCA - nucleo (versao divulgada ate dez/2025)
    bloco: inflacao
    unidade: "% ao mes"
    periodicidade: mensal
    ajuste_sazonal: nao_aplicavel
    inicio: null
    papel: auditoria
    transformacao: nenhuma
    status: confirmado
    encerrada: true   # congelada em nov/2025 por design: nao envelhece
    notas: >
      O BCB congelou as versoes antigas dos nucleos em codigos separados (29675, 29677-29682),
      encerradas em nov/2025, enquanto os codigos canonicos seguem com a metodologia nova.
      Auditado em 12/09/2026: cobre fev/1996 a nov/2025 e coincide com 4466 em 355 dos 358
      meses sobrepostos (maior diferenca 0.01 p.p., compativel com arredondamento).
      Conclusao: 29675 e a versao congelada de 4466 e o historico foi recalculado, logo nao
      ha emenda a fazer. A serie fica no projeto como evidencia da auditoria, nao como insumo.

  - id: ipca
    fonte: sgs
    codigo: 433
    nome: IPCA - variacao mensal
    bloco: inflacao
    unidade: "% ao mes"
    periodicidade: mensal
    ajuste_sazonal: nao_aplicavel
    inicio: 1980-01
    papel: surpresa
    transformacao: nenhuma
    notas: >
      Realizado que e pareado com a mediana do Focus da vespera para medir surpresa.

  - id: ipca_12m
    fonte: sgs
    codigo: 13522
    nome: IPCA - acumulado em 12 meses
    bloco: inflacao
    unidade: "% em 12 meses"
    periodicidade: mensal
    ajuste_sazonal: nao_aplicavel
    inicio: 1980-12
    papel: contexto
    transformacao: nenhuma
    notas: >
      Exibicao apenas. Deliberadamente NAO alimenta o classificador: acumulado em 12 meses
      vira de sinal muitos meses depois da virada real da inflacao.

  # -------------------------------------------------- POLITICA E EXPECTATIVAS
  - id: selic_meta
    fonte: sgs
    codigo: 432
    nome: Taxa de juros - Meta Selic definida pelo Copom
    bloco: politica
    unidade: "% ao ano"
    periodicidade: diaria
    ajuste_sazonal: nao_aplicavel
    inicio: 1999-03
    papel: contexto
    transformacao: ultimo valor do mes
    notas: >
      Instrumento de politica. Contexto do quadrante, nunca criterio de classificacao.

  - id: cambio_ptax_venda
    fonte: sgs
    codigo: 1
    nome: Taxa de cambio - livre - dolar americano (venda) - diario
    bloco: politica
    unidade: BRL/USD
    periodicidade: diaria
    ajuste_sazonal: nao_aplicavel
    inicio: 1984-11
    papel: contexto
    transformacao: media do mes
    notas: >
      Contexto visual. Nivel absoluto de cambio jamais entra em regra de classificacao,
      que e exatamente o erro que envelhece mal em paineis macro.

  # ---------------------------------------------- EXPECTATIVAS FOCUS (semana 2)
  - id: focus_ipca_mensal
    nome: Focus - expectativa de IPCA mensal (mediana)
    fonte: focus
    recurso: ExpectativaMercadoMensais
    indicador: IPCA
    bloco: expectativas
    unidade: "% ao mes"
    periodicidade: mensal
    ajuste_sazonal: nao_aplicavel
    papel: surpresa
    base_calculo: 0
    inicio: 2003-01
    notas: >
      baseCalculo fixado em 0 (janela de apuracao com amostra maior) e nunca misturado com 1.
      Consenso relevante = mediana da ultima coleta ANTERIOR a data de divulgacao.

  - id: focus_desocupacao_mensal
    nome: Focus - expectativa de taxa de desocupacao mensal (mediana)
    fonte: focus
    recurso: ExpectativaMercadoMensais
    indicador: Taxa de desocupação   # literal exato do filtro OData: acentos importam
    bloco: expectativas
    unidade: "%"
    periodicidade: mensal
    ajuste_sazonal: nao_aplicavel
    papel: surpresa
    base_calculo: 0
    inicio: 2021-08
    notas: >
      Verificado em 12/09/2026: o Focus so passou a pesquisar expectativa de desocupacao
      em agosto de 2021, apesar de a PNAD Continua existir desde 2012. A surpresa do lado
      da atividade tem, portanto, apenas cinco anos de historico por esta serie; o PIB
      trimestral cobre desde 2002 e e o complemento. Ver docs/metodologia.md.

  - id: focus_cambio_mensal
    nome: Focus - expectativa de cambio mensal (mediana)
    fonte: focus
    recurso: ExpectativaMercadoMensais
    indicador: Câmbio   # literal exato do filtro OData: acentos importam
    bloco: expectativas
    unidade: BRL/USD
    periodicidade: mensal
    ajuste_sazonal: nao_aplicavel
    papel: surpresa
    base_calculo: 0
    inicio: 2003-01

  - id: focus_pib_trimestral
    nome: Focus - expectativa de PIB Total trimestral (mediana)
    fonte: focus
    recurso: ExpectativasMercadoTrimestrais
    indicador: PIB Total
    bloco: expectativas
    unidade: "% no trimestre"
    periodicidade: trimestral
    ajuste_sazonal: nao_aplicavel
    papel: surpresa
    base_calculo: 0
    inicio: 2003-01
    notas: >
      Unica medida de surpresa do lado do crescimento: nao existe consenso Focus para o IBC-Br.

  # ------------------------------------------------------- CONTAS NACIONAIS
  # As tres saem da mesma tabela e da mesma divulgacao, e existem para uma conta
  # so: as duas razoes em % do PIB da pagina de Investimento. Nenhuma delas e
  # medida de atividade - para isso o projeto usa `pib`, que e indice de volume.

  - id: pib_corrente
    fonte: ibge
    tabela: 1846
    variavel: 585
    classificacao: 11255
    categoria: 90707
    nome: PIB a precos de mercado - valores a precos correntes
    bloco: contas_nacionais
    unidade: R$ milhoes correntes
    periodicidade: trimestral
    ajuste_sazonal: nao_aplicavel
    inicio: 1996-01
    frescor_max_dias: 260   # o trimestre Q sai ~65 dias depois de fechar
    papel: contexto
    transformacao: denominador das razoes em % do PIB (soma movel de 4 trimestres)
    verificacao: >
      O SGS foi testado primeiro e descartado: a familia 22xxx das Contas
      Nacionais so tem indice de volume, e as series a precos correntes pararam
      em 2022. Conferido em 18/09/2026 contra a divulgacao do 2T2026: PIB
      3425728, FBCF 552092 e consumo do governo 667666 (R$ milhoes), o que da
      16,1% e 19,5% do PIB no trimestre isolado - os numeros que o IBGE publica.
      Cobertura 1996Q1 a 2026Q2, 122 trimestres, sem valor ausente nas tres
      categorias.
    notas: >
      Denominador, e nunca medida de atividade: a variacao deste indice e
      crescimento nominal, nao real. Para crescimento use `pib` (indice
      encadeado de volume, SGS 22099), que e outra serie e responde outra
      pergunta.

  - id: fbcf_corrente
    fonte: ibge
    tabela: 1846
    variavel: 585
    classificacao: 11255
    categoria: 93406
    nome: Formacao bruta de capital fixo - valores a precos correntes
    bloco: contas_nacionais
    unidade: R$ milhoes correntes
    periodicidade: trimestral
    ajuste_sazonal: nao_aplicavel
    inicio: 1996-01
    frescor_max_dias: 260
    papel: contexto
    transformacao: numerador da taxa de investimento (soma movel de 4 trimestres sobre o PIB)
    verificacao: >
      Mesma conferencia de `pib_corrente`, feita em 18/09/2026. A categoria
      devolvida pela API e conferida a cada coleta contra a pedida, porque trocar
      93406 por 93405 produziria um arquivo plausivel que nenhum portao pegaria.
    notas: >
      Soma o investimento publico e o privado. Isso importa na leitura da pagina:
      obra do governo sobe esta linha, nao a de consumo da administracao publica.

  - id: consumo_governo_corrente
    fonte: ibge
    tabela: 1846
    variavel: 585
    classificacao: 11255
    categoria: 93405
    nome: Despesa de consumo da administracao publica - valores a precos correntes
    bloco: contas_nacionais
    unidade: R$ milhoes correntes
    periodicidade: trimestral
    ajuste_sazonal: nao_aplicavel
    inicio: 1996-01
    frescor_max_dias: 260
    papel: contexto
    transformacao: numerador do gasto publico em % do PIB (soma movel de 4 trimestres)
    verificacao: >
      Mesma conferencia de `pib_corrente`, feita em 18/09/2026.
    notas: >
      Remuneracao de servidores e consumo intermediario do governo. NAO e gasto
      publico total: ficam de fora as transferencias (Previdencia, Bolsa
      Familia), os juros da divida e o investimento publico, que esta em
      `fbcf_corrente`. Quem le esta serie como "tamanho do Estado" esta vendo
      talvez metade dele, e a pagina de Investimento diz isso na tela.

# ---------------------------------------------------------------------------
# Calendario de divulgacoes do IBGE (API v3 de calendario).
# Papel auxiliar: alimenta o painel "proximas divulgacoes" e adensa o polling.
# NAO dispara ingestao - a fonte da verdade e sempre o diff da propria serie.
# Cada produto_id e mapeado para as series que ele alimenta.
# ---------------------------------------------------------------------------
calendario:
  produtos:
    9256: [ipca, ipca_12m]          # Indice Nacional de Precos ao Consumidor Amplo
    9171: [desocupacao]             # PNAD Continua - divulgacao mensal
    9294: [pim, pim_sa]             # PIM-PF Brasil
    9300: [pib, pib_corrente, fbcf_corrente, consumo_governo_corrente]  # Contas Nacionais Trimestrais
