[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ciclo-br"
version = "0.1.0"
description = "Classificador de regime macroeconômico brasileiro com pipeline reprodutível"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "tenacity>=9.0",
    "PyYAML>=6.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "duckdb>=1.1",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
# O painel é extra de propósito: o job de ingestão roda `pip install -e .` e não
# precisa de Streamlit para coletar dado. Quem instala o extra é o desenvolvedor,
# a CI e o Streamlit Cloud.
painel = ["streamlit>=1.40"]
# O briefing com modelo de linguagem. Sem isto o gerador determinístico assume,
# e o rodapé do briefing diz que assumiu.
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.3", "ruff>=0.8", "streamlit>=1.40"]

[project.scripts]
ciclo-ingest = "ciclo_br.ingestion.run:main"
ciclo-calendario = "ciclo_br.ingestion.calendario:main"
ciclo-qualidade = "ciclo_br.qualidade:main"
ciclo-transformar = "ciclo_br.transformacao:main"
ciclo-regime = "ciclo_br.regime:main"
ciclo-validar = "ciclo_br.validacao:main"
ciclo-surpresa = "ciclo_br.surpresa:main"
ciclo-briefing = "ciclo_br.briefing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
